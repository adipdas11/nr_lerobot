[project]
name = "nr-lerobot"
version = "0.1.0"
description = "Host-side LeRobot ACT training and dataset tools for the NR dual-arm workspace"
readme = "README.md"
authors = [{ name = "Adip Das", email = "adipdas11@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot",
    "pandas",
    "pyarrow",
    "rosbags",
    "safetensors",
]

[tool.uv.sources]
lerobot = { path = "./lerobot", editable = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
